  <!-- 虹膜 -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="url(#beam)" stroke-width="14" opacity="0.9"/>

  <!-- X 光束 -->
  <g stroke="url(#beam)" stroke-width="18" stroke-linecap="round">
    <path d="M199 199 L313 313"/>
    <path d="M313 199 L199 313"/>
  </g>
  <g stroke="#e6fbff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M199 199 L313 313"/>
    <path d="M313 199 L199 313"/>
  </g>

  <!-- 瞳孔中的工作流节点 -->
