:root{--bg:#e9e1cc;--pnl:#f4edda;--pnl2:#eee6cf;--ln:#d2c4a0;--ln2:#a8946a;--tx:#2b2313;--dim:#6d5e40;--dim2:#94835d;

--sh:0 0 24px rgba(245,179,61,.10);--hov:rgba(245,179,61,.045)}

body.volt{--bg:#0d0a1c;--pnl:#161130;--pnl2:#100c22;--ln:#322a5e;--ln2:#554a8c;--tx:#e7e2ff;--dim:#a89ed9;--dim2:#837bb5;
--am:#a866ff;--amr:rgba(168,102,255,.42);--gr:#52d1a5;--cy:#55c8e8;--rd:#ff6f7e;
--hdr:rgba(13,10,28,.94);--scan:rgba(90,60,200,.05);--vig:radial-gradient(130% 95% at 50% -5%,transparent 55%,rgba(30,12,70,.55)),linear-gradient(115deg,rgba(168,102,255,.14),transparent 45%),linear-gradient(75deg,rgba(85,200,232,.05),transparent 40%);
--sh:0 0 24px rgba(168,102,255,.12);--hov:rgba(168,102,255,.07)}
body.volt{color-scheme:dark}

--am:#d25741;--amr:rgba(210,87,65,.40);--gr:#6fbf8f;--cy:#7fa9c9;--rd:#e06858;
--hdr:rgba(24,26,30,.95);--scan:rgba(0,0,0,.18);--vig:radial-gradient(130% 95% at 50% -5%,transparent 55%,rgba(0,0,0,.5));
--sh:0 0 22px rgba(210,87,65,.08);--hov:rgba(210,87,65,.07)}
body.ink{color-scheme:dark}

html{color-scheme:light}body.night{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.55 var(--mono);transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.5;
 background:repeating-linear-gradient(0deg,transparent 0 3px,var(--scan) 3px 4px)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:98;background:var(--vig)}
header{position:sticky;top:0;z-index:50;background:var(--hdr);backdrop-filter:blur(6px)}
header::after{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--ln2) 18%,var(--am) 50%,var(--ln2) 82%,transparent);opacity:.7}
.wrap{max-width:1150px;margin:auto;display:flex;align-items:center;gap:26px;padding:13px 16px;flex-wrap:wrap}
.brand{font:700 19px/1 var(--disp);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.brand .dia{width:13px;height:13px;background:var(--am);transform:rotate(45deg);box-shadow:0 0 10px var(--amr);animation:beat 2.4s infinite}
@keyframes beat{50%{box-shadow:0 0 18px var(--amr),0 0 3px var(--am)}}
.ops{color:var(--am)}
.gauges{display:flex;gap:22px;align-items:baseline}
.g{display:flex;align-items:baseline;gap:6px}
.g b{font:700 23px/1 var(--disp);font-variant-numeric:tabular-nums}
.g span{font-size:8.5px;letter-spacing:.26em;color:var(--dim2)}
.g.lv b{color:var(--am)}.g.ok b{color:var(--gr)}.g.er b{color:var(--rd)}
.tools{margin-left:auto;display:flex;gap:14px;align-items:center}
#fq{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln2);padding:4px 9px;font:500 10px var(--mono);letter-spacing:.05em;width:180px;outline:none}
#fq:focus{border-color:var(--am)}
#fq::placeholder{color:var(--dim2)}
.cfgp{max-width:1150px;margin:10px auto 0;background:var(--pnl);border:1px solid var(--ln2);box-shadow:var(--sh);position:relative;overflow:hidden;animation:rise .28s ease-out}
.cfgp[hidden]{display:none}
.cfhead{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--ln);background:linear-gradient(180deg,var(--pnl2),var(--pnl));font:600 10px var(--disp);letter-spacing:.28em;color:var(--am)}
.cfhead .led{width:7px;height:7px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr);animation:beat 2s infinite}
.cfsub{margin-left:auto;font:400 9px var(--mono);letter-spacing:.04em;color:var(--dim2)}
.mod{display:grid;grid-template-columns:128px 1fr;gap:14px;padding:13px 16px;border-bottom:1px dashed var(--ln);align-items:start;animation:rise .32s both}
.mod:nth-child(3){animation-delay:.04s}.mod:nth-child(4){animation-delay:.08s}.mod:nth-child(5){animation-delay:.12s}
.mod:nth-child(6){animation-delay:.16s}.mod:nth-child(7){animation-delay:.2s}
.modtag{font:600 11px var(--disp);letter-spacing:.12em;color:var(--tx);display:flex;align-items:baseline;gap:9px;padding-top:1px}
.modtag b{font:700 16px/1 var(--disp);color:var(--am);opacity:.42;min-width:20px;letter-spacing:0;font-variant-numeric:tabular-nums}
.modbody{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.modnote{font:400 9px var(--mono);letter-spacing:.05em;color:var(--dim2);align-self:center}
.cfgp input[type=text],.cfgp input[type=number]{background:var(--pnl2);border:1px solid var(--ln2);color:var(--tx);padding:5px 9px;font:11px var(--mono);transition:border-color .15s,box-shadow .15s}
.cfgp input[type=text]{flex:1;min-width:240px}
.cfgp input[type=number]{width:96px;font-size:13px;font-variant-numeric:tabular-nums}
.cfgp input:focus,.cfgp select:focus{outline:none;border-color:var(--am);box-shadow:0 0 0 1px var(--am),0 0 10px var(--amr)}
.hmsg{font-size:10px;letter-spacing:.06em;color:var(--dim2)}
.cfsave{display:flex;align-items:center;gap:16px;padding:12px 16px;background:linear-gradient(180deg,var(--pnl),var(--pnl2));border-top:1px solid var(--ln2)}
.cfsave .hmsg{flex:1;text-align:right;max-height:5.2em;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding-right:2px}
.save{background:var(--am);color:var(--bg);border:1px solid var(--am);padding:7px 18px;font:700 11px var(--disp);letter-spacing:.14em;cursor:pointer;white-space:nowrap;box-shadow:0 2px 10px var(--amr);transition:filter .15s,box-shadow .15s,transform .1s;position:relative}
.save:hover{filter:brightness(1.08);box-shadow:0 3px 16px var(--amr);transform:translateY(-1px)}
.save:active{transform:translateY(0)}
.save.dirty::after{content:'●';position:absolute;top:-7px;right:-5px;font-size:10px;color:var(--rd);animation:blink 1.1s infinite}
@media(max-width:640px){.mod{grid-template-columns:1fr;gap:7px}.cfsave .hmsg{text-align:left}}
select{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln2);border-radius:0;padding:4px 8px;font:11px var(--mono);max-width:320px}
.tgl{background:var(--pnl2);color:var(--dim);border:1px solid var(--ln2);padding:4px 11px;font:600 10px var(--mono);letter-spacing:.18em;cursor:pointer}
.tgl:hover{color:var(--am);border-color:var(--am)}
.tgl.on{color:var(--am);border-color:var(--am)}
.sw{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:10px;letter-spacing:.12em;color:var(--dim);user-select:none}
.sw input{display:none}.sw i{width:32px;height:16px;border:1px solid var(--ln2);position:relative;transition:.2s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--dim);transition:.2s}
.sw input:checked+i{border-color:var(--am);box-shadow:inset 0 0 9px var(--amr)}
.sw input:checked+i::after{left:18px;background:var(--am)}
main{padding:18px 16px 70px;display:flex;flex-direction:column;gap:16px;max-width:1150px;margin:0 auto}
.card{background:var(--pnl);border:1px solid var(--ln);padding:14px 16px;position:relative;box-shadow:var(--sh)}
.card.en{animation:rise .5s both}
.card.live{border-color:var(--am)}
.card.live::after{content:'◤ LIVE FEED';position:absolute;top:-7px;right:16px;background:var(--pnl);color:var(--am);font:600 9px var(--mono);letter-spacing:.28em;padding:0 8px}
.hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.b{font:600 10px var(--mono);letter-spacing:.2em;padding:2.5px 9px;border:1px solid}
.b::before{content:'■ ';font-size:8px;vertical-align:1px}
.b-running{color:var(--am);border-color:var(--am);animation:blink 1.8s infinite}
.b-completed,.b-done{color:var(--gr);border-color:color-mix(in srgb,var(--gr) 50%,transparent)}
.b-failed,.b-error,.b-stale,.b-killed,.b-timeout{color:var(--rd);border-color:color-mix(in srgb,var(--rd) 55%,transparent)}
.b-aborted{color:var(--dim);border-color:var(--ln2);border-style:dashed}
.b-waiting,.b-ended{color:var(--cy);border-color:color-mix(in srgb,var(--cy) 50%,transparent)}
/* 回合已完(waitReason=turn):模型说完、正常交回话轮 = 执行完成 —— 安静显示,不占用 ⏸ 告警视觉(1.2.13) */
.b-turn{color:var(--cy);border-color:color-mix(in srgb,var(--cy) 55%,transparent)}
.b-ended{border-style:dashed;color:var(--dim)}
.s-waiting{color:var(--cy)}.s-idle{color:var(--dim2)}.s-ended{color:var(--dim)}
.secttl{display:flex;align-items:baseline;gap:14px;max-width:1150px;margin:14px auto -6px;padding:0 16px;font:600 10px var(--disp);letter-spacing:.28em;color:var(--am)}
.secttl::after{content:'';flex:1;height:1px;background:var(--ln)}
main.sesstop{padding-bottom:2px}
.b-blocked{color:var(--cy);border-color:color-mix(in srgb,var(--cy) 50%,transparent)}
/* 等待用户输入(3.2)：反白实心徽标 = 页面里唯一"该你动手"的信号，与 running(空心闪) / waiting(静青) 区分 */
.b-input_required{color:var(--pnl);background:var(--am);border-color:var(--am);animation:blink 1.8s infinite}
.b-input_required::before{content:'⏸ '}
.card.wait{box-shadow:inset 3px 0 0 var(--am),var(--sh)}
.waitline{display:block;margin-top:7px;padding:0;border:1px dashed var(--am);background:color-mix(in srgb,var(--am) 8%,transparent);font:500 11px var(--mono)}
.waitline>summary{display:flex;align-items:baseline;gap:9px;padding:5px 9px;cursor:pointer;list-style:none}
.waitline>summary::-webkit-details-marker{display:none}
.waitline>summary::after{content:'▾';color:var(--am);margin-left:auto}
.waitline[open]>summary::after{content:'▾';transform:rotate(180deg)}
.waitline .wk{color:var(--am);letter-spacing:.08em;white-space:nowrap}
.waitline .wt{color:var(--tx);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.waitline .term-body{margin:0 9px 9px}
.waitline.turn{border-color:color-mix(in srgb,var(--cy) 45%,transparent);background:color-mix(in srgb,var(--cy) 6%,transparent)}
.waitline.turn>summary::after,.waitline.turn .wk{color:var(--cy)}
/* 输入寄存器(prompt echo):❯=终端提示符 —— 机器等你(⏸ 琥珀虚线)对仗你已给出(❯ 青左线)。
   眉标把留存上限摊在界面上(铁律7);摘要仅作折叠,展开=IN pane 全文/不可回取三态(与等待行同契约) */
.phead{display:flex;align-items:baseline;gap:9px;margin-top:9px;font:500 9px var(--mono);letter-spacing:.24em;color:var(--dim2)}

}
// ── 按卡 diff 渲染:render()/renderSessions() 共用的唯一实现(1.2.18 抽取) ─────────────
// 这里住着卡片区所有用血换来的不变量,是"改一处两处同审"教训的结构性终结——新增卡片区直接复用:
//  · 稳定节点身份:HTML 串不变的卡绝不重建(滚动/选中/hover/details 展开不闪);
//  · outerHTML 重建后 ref 必须同步到新节点(旧节点已脱离文档,拿它 insertBefore 抛 NotFoundError 打断整轮渲染);
//  · details open 态 + pane scrollTop 快照跨重建恢复(不恢复即"点开即关"复发);
//  · 离开的 rid 连 store 串一并删除(防陈旧 diff 串滞留);
//  · 新出现卡片在稳态只演一次入场(.en + delay 0)。
function diffPaint(el, store, items, painted) {
    const open = new Set([...el.querySelectorAll('details[open]')].map(x => x.dataset.k || ''));
    const sc = {};
    el.querySelectorAll('details').forEach(x => { if (x.dataset.k)
        sc[x.dataset.k] = [...x.querySelectorAll('.rich,.pane pre')].map(s => s.scrollTop); });
    const seen = new Set();
    let ref = el.firstElementChild;
    for (const { id, html } of items) {
        seen.add(id);
        const sl = `:scope>div[data-rid="${CSS.escape(id)}"]`;
        let e2 = el.querySelector(sl);
        if (!e2) {
            store[id] = html;
            const t = document.createElement('template');
            t.innerHTML = html;
            e2 = t.content.firstElementChild;
            if (painted) {
                e2.classList.add('en');
                e2.style.animationDelay = '0ms';
            } // 运行中新出现的卡:单卡入场
            el.insertBefore(e2, ref);
        }
        else {
            if (store[id] !== html) {
                store[id] = html;
                const was = e2;
                e2.outerHTML = html;
                e2 = el.querySelector(sl);
                if (ref === was)
                    ref = e2; // outerHTML 分离旧节点:ref 若正指着它必须跟到新节点(NotFoundError 根因)
            }
            if (e2 && e2 !== ref)
                el.insertBefore(e2, ref);
        }
        ref = e2 ? e2.nextElementSibling : null;
    }
    for (const x of [...el.children]) {
        const rid = x.dataset.rid;
        if (rid && !seen.has(rid)) {
            delete store[rid];
            x.remove();
        }
    }
    if (open.size)
        el.querySelectorAll('details').forEach(x => {
            const dk = x.dataset.k || '';
            if (open.has(dk)) {
                x.open = true;
                x.classList.add('noanim');
                const v = sc[dk];
                if (v)
                    x.querySelectorAll('.rich,.pane pre').forEach((s2, i2) => { if (v[i2])
                        s2.scrollTop = v[i2]; });
            }
        });
}
// 会话命中判定单点(renderSessions 与仪表 TASKS 共用——同一过滤口径,两处不许各写一份)
const sessHit = (s) => {
    const q = fstr.toLowerCase();
    return (!fproj || (s.cwd || s.project) === fproj) && (!q || (s.title + ' ' + s.sessionId + ' ' + (s.cwd || s.project) + ' ' + s.status + ' ' + (s.waitReason || '') + ' ' + (s.waitTool || '') + ' ' + (s.lastPrompt || '') + ' ' + (s.prompts || []).map(p => p.t).join(' ') + ' ' + (s.subagents || []).map(a => a.label + ' ' + (a.description || '')).join(' ')).toLowerCase().includes(q));
};
function renderSessions() {
    const el = $('sess'), tt = $('secttl');
    if (!sess.length) {
        tt.hidden = true;
        el.innerHTML = '';
        return;
    }
    tt.hidden = false;
    const vis = sess.filter(sessHit), live = sess.filter(s => s.alive).length, waiting = vis.filter(sessStuck).length; // ⏸ 只数真卡住(ask/permission);回合已完(turn)不算等待(1.2.13)
    tt.innerHTML = `${T('AGENT 状态 · 会话(主+子)')} ${vis.length}${live ? ' · ' + T('活跃') + ' ' + live : ''}${waiting ? ' · <b class="wtag">⏸ ' + T('等待输入') + ' ' + waiting + '</b>' : ''}`;
    if (!vis.length) {
        el.innerHTML = `<p class="idle">${T('NO MATCH · 无匹配会话')}</p>`;
        spainted = true;
        return;
    }
    if (el.querySelector('.idle'))
        el.innerHTML = '';
    // 活跃会话卡每轮 HTML 都会变→outerHTML 重建;快照/恢复等契约全在 diffPaint(与运行卡区同一实现)
    diffPaint(el, SCARDS, vis.map((r, i) => ({ id: r.sessionId, html: sessCard(r, i) })), spainted);
    spainted = true;
}
function render() {
    const list = $('list');
    const q = fstr.toLowerCase();
    const vis = runs.filter(r => (!fproj || (r.cwd || r.project) === fproj) && (!q || (r.name + ' ' + r.runId + ' ' + (r.cwd || r.project) + ' ' + r.status + ' ' + (r.task || '')).toLowerCase().includes(q)));
    const n = (f) => vis.filter(f).length;
    // 过滤/搜索是持久化视图状态(1.2.9)——仪表计数随之变化,若不自证口径就会被当成"数据不准"(用户真实报过:
    // 只见 "3 RUNS" 不知还有第 4 个被筛掉)。有过滤时 RUNS 显示「命中/总数」+ tooltip 交代原因。
    const flt = !!(fproj || q);
    // TASKS = 主 agent 执行任务总次数,回看窗口口径(1.2.36:旧口径只加视图内会话,而视图=「活跃+近2h」,
    // 窗口设 180 天仪表仍显近几小时的数)。数据源 tasks{total,byCwd}=后端全转录精确计数;无 tasks(旧后端)回落视图和。
    // 过滤时:仅项目→byCwd 命中/总数(覆盖该项目全部会话);含搜索→搜索只能命中视图会话,任务命中按视图算并在 title 交代。
    const tsum = (ls) => ls.reduce((a, s) => a + (s.turns || 0), 0);
    const tAll = tasksData ? tasksData.total : tsum(sess);
    const tHit = !flt ? tAll : tasksData && fproj && !fstr ? (tasksData.byCwd[fproj] || 0) : tsum(sess.filter(sessHit));
    const gh = `<div class="g"${flt ? ` title="${esc(T('已按项目/搜索过滤：显示 %1 个，共 %2 个运行 · 任务 %3/%4', vis.length, runs.length, tHit, tAll))}"` : ''}><b>${vis.length}${flt ? '/' + runs.length : ''}</b><span>RUNS</span></div>
    <div class="g"><b>${tHit}${flt ? '/' + tAll : ''}</b><span>TASKS</span></div>
    <div class="g lv"><b>${n(r => r.status === 'running')}</b><span>LIVE</span></div>
    <div class="g ok"><b>${n(r => r.status === 'completed')}</b><span>DONE</span></div>
    <div class="g er"><b>${n(r => ALERT_ST.has(r.status))}</b><span>ALERT</span></div>`;
    if (gh !== GSTR[0]) {
        $('gauges').innerHTML = gh;
        GSTR[0] = gh;
    }
    // 空态→非空态:先摘 NO MATCH 段。<p.idle> 无 data-rid,下面的按卡清理会跳过它——不显式摘除就永久
    // 残留在结果尾部(与 renderSessions 的 .idle 清理对称;历史缺失,无头桩 t-diff 复现,1.2.18 修)
    if (vis.length && list.querySelector('.idle'))
        list.innerHTML = '';
    // 按卡 diff 全在 diffPaint(与会话区同一实现):串稳定的卡绝不重建,滚动/选中/hover 不跳
    diffPaint(list, CARDS, vis.map((r, ii) => ({ id: r.runId, html: card(r, ii) })), painted);
    if (!vis.length && !list.querySelector('.idle'))
        list.innerHTML = `<p class="idle">${(q || fstr || fproj) ? T('NO MATCH · 无匹配运行，调整搜索或筛选') : T('TELEMETRY SILENT · 近 %1 天无 workflow 运行记录', rdays)}</p>`;
    painted = true;
}
// ── 页面级视口锚定(tick 与全部重绘入口的统一包装)──
// 用户反馈「执行任务中,展开工具调用/agent 详情后上下滚动出现上下漂移」的根因:旧实现把锚点
// 捕获放在 render() 函数体开头,而 tick() 先跑 renderSessions()——执行中会话卡每轮长高(新步骤行)
// 时基线已被增长污染,补偿恒 0;且锚点只在运行卡区找,视线在会话区时不该补的也补。
// 正确语义(等价于浏览器原生 scroll-anchoring 在外壳被 outerHTML 重建后依然生效):
// 基线必须在**任何重建之前**捕获;锚点=文档序(会话卡→运行卡)中第一张底边仍在视口的卡——
// 锚点之上的内容(区标题变高/上方卡长高)变化即补偿,锚点卡自身在视口顶以下追加不补偿。
function renderAnchored() {
    const cards = [...$('sess').children, ...$('list').children];
    const ancEl = cards.find(x => x.getBoundingClientRect().bottom > 2);
    const anc = ancEl ? ancEl.dataset.rid || null : null, off0 = ancEl ? ancEl.getBoundingClientRect().top : 0;
    renderSessions();
    render();
    if (anc) {
        const ae = [...$('sess').children, ...$('list').children].find(c => c.dataset.rid === anc);
        if (ae) {
            const d = ae.getBoundingClientRect().top - off0;
            if (Math.abs(d) > 1)
                window.scrollTo(0, window.scrollY + d);
        } // 含 details open 恢复后的最终高度
    }
}
$('fproj').onchange = e => { fproj = e.target.value; localStorage.setItem('wfo-fproj', fproj); renderAnchored(); };
$('fq').oninput = e => { fstr = e.target.value.trim(); localStorage.setItem('wfo-fstr', fstr); renderAnchored(); };
$('auto').onchange = e => { auto = e.target.checked; localStorage.setItem('wfo-auto', auto ? '1' : '0'); };
// 首次展开:按 agentId 拉全文(transcript+journal),替换截断预览;FULL 缓存跨轮询重建存活
// data-src 两种形态:proj|sess|run|agent(workflow) 或 S|proj|sess|agent(主/子会话,agent=main#msgId 为主会话单步)
const onToggle = (e) => {
    const x = e.target;
    if (!(x instanceof HTMLDetailsElement) || !x.open || !x.dataset.src)
        return;
    const k = x.dataset.k || '';
    if (!k || FULL[k])
        return;
    const sp = x.dataset.src.split('|');
    let url;
    if (sp[0] === 'S') {
        let ag = sp[3] || '', extra = '';
        const h = ag.indexOf('#'); // data-src=S|proj|sess|agent(4段);sp[4] 曾误用致 agent=''→全文拉空(TS 迁移回归)
        if (h >= 0) {
            extra = '&msg=' + encodeURIComponent(ag.slice(h + 1));
            ag = ag.slice(0, h);
        }
        url = `/api/subagent?proj=${encodeURIComponent(sp[1] || '')}&sess=${encodeURIComponent(sp[2] || '')}&agent=${encodeURIComponent(ag)}${extra}`;
    }
    else {
        url = `/api/agent?proj=${encodeURIComponent(sp[0] || '')}&sess=${encodeURIComponent(sp[1] || '')}&run=${encodeURIComponent(sp[2] || '')}&agent=${encodeURIComponent(sp[3] || '')}`;
    }
    // 活节点查询:fetch 期间轮询可能已重建卡片(x 成孤儿节点),一律按 data-k 重查再写
    const live = () => (x.ownerDocument || document).querySelector(`details[data-k="${CSS.escape(k)}"]`) || x;
    const livePanes = () => live().querySelectorAll('.pane');
    // 转场(用户反馈"约 1 秒后突然一闪"):展开即给 pane 挂 .q 拉取扫描光,"等一下"变成有预告的过渡;
    // 到达时换内容的 pane 走 .xf 内容淡入 + .xfp 一次性扫光(见 template.html keyframes)
    livePanes().forEach(pn => pn.classList.add('q'));
    const note = (txt) => {
        livePanes().forEach(pn => pn.classList.remove('q'));
        const rich = live().querySelector('.pane .rich');
        if (rich)
            rich.textContent = txt;
    };
    fetch(url).then(r => r.json()).then(rd => {
        const d = rd;
        if (FULL[k]) {
            livePanes().forEach(pn => pn.classList.remove('q'));
            return;
        } // 并发展开已回填:摘掉加载态防止扫描光永挂
        FULL[k] = { p: d.prompt || '', r: d.result || '', m: !!d.miss };
        livePanes().forEach(pn => {
            const t = pn.dataset.t || '', rich = pn.querySelector('.rich');
            pn.classList.remove('q');
            if (!rich)
                return;
            let xf = false;
            if (t.startsWith('IN') && FULL[k].p) {
                rich.innerHTML = mdLite(wrapLong(unent(FULL[k].p)));
                pn.dataset.t = 'IN · ' + T('全文');
                xf = true;
            }
            else if (t.startsWith('IN') && d.miss) {
                rich.textContent = T('⚠ 该步已超出转录留存范围，无法回取全文');
                pn.dataset.t = 'IN · ' + T('不可回取');
                xf = true;
            }
            if (t.startsWith('OUT') && FULL[k].r) {
                rich.innerHTML = mdLite(pretty(unent(FULL[k].r)));
                pn.dataset.t = 'OUT · ' + T('全文');
                xf = true;
            }
            else if (t.startsWith('OUT') && d.miss) {
                rich.textContent = T('⚠ 该步已超出转录留存范围，无法回取全文');
                pn.dataset.t = 'OUT · ' + T('不可回取');
                xf = true;
            }
            if (xf) {
                void pn.offsetWidth;
                pn.classList.add('xfp');
                rich.classList.add('xf');
            } // offsetWidth 强制 reflow:扫光可从 .q 位置起重播
        });
    }).catch(err => { note(T('⚠ 全文加载失败: ') + String((err && err.message) || err)); });
};
$('list').addEventListener('toggle', onToggle, true);
$('sess').addEventListener('toggle', onToggle, true);
$('verB').textContent = VER ? 'v' + VER : ''; // 版本角标:旧标签页(无此角标)= 陈旧代码,请刷新
setInterval(() => { if (auto)
    void tick(); }, 2000);
void tick();
// 后台标签页节流补偿:浏览器(Chrome 严格节流/Safari 挂起)会把隐藏页的 setInterval 降到 ~1 次/分钟——
// 用户在终端输入后切回页面,切回瞬间看到的是降频前的旧状态(真实反馈:"输入内容后不能立刻看到最近任务执行的信息")。
// 恢复可见/从 bfcache 返回/窗口回焦 → 立即补扫一轮;三事件同瞬触发用 1s 冷却去重;auto 关闭尊重用户设置不越权。
let lastCatch = 0;
function catchUp() {
    if (document.hidden || !auto)
        return;
    const now = Date.now();
    if (now - lastCatch < 1000)
        return;
    lastCatch = now;
    void tick();
}
document.addEventListener('visibilitychange', catchUp);
window.addEventListener('pageshow', catchUp);
window.addEventListener('focus', catchUp);
</script></body></html>
