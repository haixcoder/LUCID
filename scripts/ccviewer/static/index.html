<style>
:root{--bg:#e9e1cc;--pnl:#f4edda;--pnl2:#eee6cf;--ln:#d2c4a0;--ln2:#a8946a;--tx:#2b2313;--dim:#6d5e40;--dim2:#94835d;

--hdr:rgba(233,225,204,.95);--scan:rgba(90,68,20,.05);--vig:radial-gradient(130% 100% at 50% -8%,transparent 58%,rgba(120,90,30,.13));

--mono:'IBM Plex Mono',ui-monospace,Menlo,"PingFang SC",monospace;--disp:'Chakra Petch','PingFang SC',var(--mono);
/* CSS content 里的少量文案走变量:html[lang] 覆盖(与 JS 字典 T() 各自一份,勿在此重复中文以外的语言逻辑) */

body.night{--bg:#141109;--pnl:#1a160e;--pnl2:#120f09;--ln:#38301c;--ln2:#5c4c2a;--tx:#ece1c9;--dim:#9a8a6b;--dim2:#6f6247;
--am:#f5b33d;--amr:rgba(245,179,61,.45);--gr:#7fdc8b;--cy:#66c9dd;--rd:#ef6a5c;
--hdr:rgba(20,17,9,.94);--scan:rgba(0,0,0,.15);--vig:radial-gradient(130% 95% at 50% -5%,transparent 55%,rgba(0,0,0,.5));
--sh:0 0 24px rgba(245,179,61,.10);--hov:rgba(245,179,61,.045)}
body.ice{--bg:#e9f0f4;--pnl:#f6f9fb;--pnl2:#edf3f6;--ln:#c8d9e1;--ln2:#8aa5b3;--tx:#17242e;--dim:#45626f;--dim2:#6d8795;
--am:#0f7f8f;--amr:rgba(15,127,143,.30);--gr:#2e8b6a;--cy:#2b5f8f;--rd:#c0504a;
--hdr:rgba(236,244,248,.95);--scan:rgba(40,84,104,.045);--vig:radial-gradient(130% 100% at 50% -8%,transparent 58%,rgba(70,110,135,.10));
--sh:0 1px 2px rgba(60,95,115,.14);--hov:rgba(15,127,143,.07)}
body.ice{color-scheme:light}
body.ice .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--am) 22%,var(--am) 78%,transparent);opacity:.8}
body.volt{--bg:#0d0a1c;--pnl:#161130;--pnl2:#100c22;--ln:#322a5e;--ln2:#554a8c;--tx:#e7e2ff;--dim:#a89ed9;--dim2:#837bb5;
--am:#a866ff;--amr:rgba(168,102,255,.42);--gr:#52d1a5;--cy:#55c8e8;--rd:#ff6f7e;
--hdr:rgba(13,10,28,.94);--scan:rgba(90,60,200,.05);--vig:radial-gradient(130% 95% at 50% -5%,transparent 55%,rgba(30,12,70,.55)),linear-gradient(115deg,rgba(168,102,255,.14),transparent 45%),linear-gradient(75deg,rgba(85,200,232,.05),transparent 40%);
--sh:0 0 24px rgba(168,102,255,.12);--hov:rgba(168,102,255,.07)}
body.volt{color-scheme:dark}
body.volt .b-running{text-shadow:0 0 8px var(--amr);box-shadow:0 0 12px var(--amr),inset 0 0 6px var(--amr)}
body.ink{--bg:#181a1e;--pnl:#22252b;--pnl2:#1b1e23;--ln:#363b44;--ln2:#5a616d;--tx:#e4e7ec;--dim:#a6adb9;--dim2:#7d8692;
--am:#d25741;--amr:rgba(210,87,65,.40);--gr:#6fbf8f;--cy:#7fa9c9;--rd:#e06858;
--hdr:rgba(24,26,30,.95);--scan:rgba(0,0,0,.18);--vig:radial-gradient(130% 95% at 50% -5%,transparent 55%,rgba(0,0,0,.5));
--sh:0 0 22px rgba(210,87,65,.08);--hov:rgba(210,87,65,.07)}
body.ink{color-scheme:dark}
body.ink .card{border-bottom:1px solid rgba(210,87,65,.18)}
body.ink .card::before{content:'';position:absolute;right:14px;bottom:0;width:110px;height:3px;background:rgba(210,87,65,.5)}
body.ink .b-running{border-style:dashed}

html{color-scheme:light}body.night{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.55 var(--mono);transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.5;
 background:repeating-linear-gradient(0deg,transparent 0 3px,var(--scan) 3px 4px)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:98;background:var(--vig)}
header{position:sticky;top:0;z-index:50;background:var(--hdr);backdrop-filter:blur(6px)}
header::after{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--ln2) 18%,var(--am) 50%,var(--ln2) 82%,transparent);opacity:.7}
.wrap{max-width:1150px;margin:auto;display:flex;align-items:center;gap:26px;padding:13px 16px;flex-wrap:wrap}
.brand{font:700 19px/1 var(--disp);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.brand .dia{width:13px;height:13px;background:var(--am);transform:rotate(45deg);box-shadow:0 0 10px var(--amr);animation:beat 2.4s infinite}
@keyframes beat{50%{box-shadow:0 0 18px var(--amr),0 0 3px var(--am)}}
.ops{color:var(--am)}
.gauges{display:flex;gap:22px;align-items:baseline}
.g{display:flex;align-items:baseline;gap:6px}
.g b{font:700 23px/1 var(--disp);font-variant-numeric:tabular-nums}
.g span{font-size:8.5px;letter-spacing:.26em;color:var(--dim2)}
.g.lv b{color:var(--am)}.g.ok b{color:var(--gr)}.g.er b{color:var(--rd)}
.tools{margin-left:auto;display:flex;gap:14px;align-items:center}
#fq{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln2);padding:4px 9px;font:500 10px var(--mono);letter-spacing:.05em;width:180px;outline:none}
#fq:focus{border-color:var(--am)}
#fq::placeholder{color:var(--dim2)}
.cfgp{max-width:1150px;margin:10px auto 0;background:var(--pnl);border:1px solid var(--ln2);box-shadow:var(--sh);position:relative;overflow:hidden;animation:rise .28s ease-out}
.cfgp[hidden]{display:none}
.cfhead{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--ln);background:linear-gradient(180deg,var(--pnl2),var(--pnl));font:600 10px var(--disp);letter-spacing:.28em;color:var(--am)}
.cfhead .led{width:7px;height:7px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr);animation:beat 2s infinite}
.cfsub{margin-left:auto;font:400 9px var(--mono);letter-spacing:.04em;color:var(--dim2)}
.mod{display:grid;grid-template-columns:128px 1fr;gap:14px;padding:13px 16px;border-bottom:1px dashed var(--ln);align-items:start;animation:rise .32s both}
.mod:nth-child(3){animation-delay:.04s}.mod:nth-child(4){animation-delay:.08s}.mod:nth-child(5){animation-delay:.12s}
.mod:nth-child(6){animation-delay:.16s}.mod:nth-child(7){animation-delay:.2s}
.modtag{font:600 11px var(--disp);letter-spacing:.12em;color:var(--tx);display:flex;align-items:baseline;gap:9px;padding-top:1px}
.modtag b{font:700 16px/1 var(--disp);color:var(--am);opacity:.42;min-width:20px;letter-spacing:0;font-variant-numeric:tabular-nums}
.modbody{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.modnote{font:400 9px var(--mono);letter-spacing:.05em;color:var(--dim2);align-self:center}
.cfgp input[type=text],.cfgp input[type=number]{background:var(--pnl2);border:1px solid var(--ln2);color:var(--tx);padding:5px 9px;font:11px var(--mono);transition:border-color .15s,box-shadow .15s}
.cfgp input[type=text]{flex:1;min-width:240px}
.cfgp input[type=number]{width:96px;font-size:13px;font-variant-numeric:tabular-nums}
.cfgp input:focus,.cfgp select:focus{outline:none;border-color:var(--am);box-shadow:0 0 0 1px var(--am),0 0 10px var(--amr)}
.hmsg{font-size:10px;letter-spacing:.06em;color:var(--dim2)}
.cfsave{display:flex;align-items:center;gap:16px;padding:12px 16px;background:linear-gradient(180deg,var(--pnl),var(--pnl2));border-top:1px solid var(--ln2)}
.cfsave .hmsg{flex:1;text-align:right}
.save{background:var(--am);color:var(--bg);border:1px solid var(--am);padding:7px 18px;font:700 11px var(--disp);letter-spacing:.14em;cursor:pointer;white-space:nowrap;box-shadow:0 2px 10px var(--amr);transition:filter .15s,box-shadow .15s,transform .1s;position:relative}
.save:hover{filter:brightness(1.08);box-shadow:0 3px 16px var(--amr);transform:translateY(-1px)}
.save:active{transform:translateY(0)}
.save.dirty::after{content:'●';position:absolute;top:-7px;right:-5px;font-size:10px;color:var(--rd);animation:blink 1.1s infinite}
@media(max-width:640px){.mod{grid-template-columns:1fr;gap:7px}.cfsave .hmsg{text-align:left}}
select{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln2);border-radius:0;padding:4px 8px;font:11px var(--mono);max-width:320px}
.tgl{background:var(--pnl2);color:var(--dim);border:1px solid var(--ln2);padding:4px 11px;font:600 10px var(--mono);letter-spacing:.18em;cursor:pointer}
.tgl:hover{color:var(--am);border-color:var(--am)}
.tgl.on{color:var(--am);border-color:var(--am)}
.sw{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:10px;letter-spacing:.12em;color:var(--dim);user-select:none}
.sw input{display:none}.sw i{width:32px;height:16px;border:1px solid var(--ln2);position:relative;transition:.2s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--dim);transition:.2s}
.sw input:checked+i{border-color:var(--am);box-shadow:inset 0 0 9px var(--amr)}
.sw input:checked+i::after{left:18px;background:var(--am)}
main{padding:18px 16px 70px;display:flex;flex-direction:column;gap:16px;max-width:1150px;margin:0 auto}
.card{background:var(--pnl);border:1px solid var(--ln);padding:14px 16px;position:relative;box-shadow:var(--sh)}
.card.en{animation:rise .5s both}
.card.live{border-color:var(--am)}
.card.live::after{content:'◤ LIVE FEED';position:absolute;top:-7px;right:16px;background:var(--pnl);color:var(--am);font:600 9px var(--mono);letter-spacing:.28em;padding:0 8px}
.hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.b{font:600 10px var(--mono);letter-spacing:.2em;padding:2.5px 9px;border:1px solid}
.b::before{content:'■ ';font-size:8px;vertical-align:1px}
.b-running{color:var(--am);border-color:var(--am);animation:blink 1.8s infinite}
.b-completed,.b-done{color:var(--gr);border-color:color-mix(in srgb,var(--gr) 50%,transparent)}
.b-failed,.b-error,.b-stale,.b-killed,.b-timeout{color:var(--rd);border-color:color-mix(in srgb,var(--rd) 55%,transparent)}
.b-aborted{color:var(--dim);border-color:var(--ln2);border-style:dashed}
.b-waiting,.b-ended{color:var(--cy);border-color:color-mix(in srgb,var(--cy) 50%,transparent)}
.b-ended{border-style:dashed;color:var(--dim)}
.s-waiting{color:var(--cy)}.s-idle{color:var(--dim2)}.s-ended{color:var(--dim)}
.secttl{display:flex;align-items:baseline;gap:14px;max-width:1150px;margin:14px auto -6px;padding:0 16px;font:600 10px var(--disp);letter-spacing:.28em;color:var(--am)}
.secttl::after{content:'';flex:1;height:1px;background:var(--ln)}
main.sesstop{padding-bottom:2px}
.b-blocked{color:var(--cy);border-color:color-mix(in srgb,var(--cy) 50%,transparent)}
@keyframes blink{50%{opacity:.45}}
h2{margin:0;font:600 17px var(--disp);letter-spacing:.05em}
.rid{font-size:10px;color:var(--dim2);letter-spacing:.08em}
.meta{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.cwd{font-size:10px;color:var(--dim2);letter-spacing:.08em;margin-top:5px}
.cwd::before{content:'▚ ';color:var(--ln2)}
.task{font-size:12px;line-height:1.75;color:var(--tx);opacity:.9;border-left:2px solid var(--am);padding-left:9px}
.taskd{margin:9px 0 0}
summary.task{cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
summary.task::-webkit-details-marker{display:none}
summary.task::after{content:' ' var(--tr-more) ' ▾';color:var(--cy);font:500 10px var(--mono);letter-spacing:.1em}
details[open]>summary.task::after{content:' ' var(--tr-less) ' ▴'}
.task.full{margin-top:8px;border-left-color:var(--ln2)}
.strip{display:flex;align-items:center;gap:20px;margin:12px 0 0;flex-wrap:wrap}
.ph{font:500 10px var(--mono);letter-spacing:.16em;color:var(--dim2);border:1px solid var(--ln);padding:2.5px 10px;position:relative}
.ph:not(:last-child)::after{content:'';position:absolute;left:calc(100% + 4px);top:50%;width:12px;height:1px;background:var(--ln2)}
.ph.fin{color:var(--gr);border-color:color-mix(in srgb,var(--gr) 45%,transparent)}.ph.fin::before{content:'✓ '}
.ph.on{color:var(--am);border-color:var(--am);animation:blink 1.8s infinite}
.pipe{position:relative;height:24px;margin:10px 0 2px}
.trk{position:absolute;left:2px;right:2px;top:11px;height:2px;background:var(--ln)}
.fil{position:absolute;left:2px;top:11px;height:2px;background:var(--gr);box-shadow:0 0 6px color-mix(in srgb,var(--gr) 55%,transparent)}
.nd{position:absolute;top:6px;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);border:1.5px solid var(--dim2);background:var(--pnl)}
.nd.done{border-color:var(--gr);background:var(--gr)}
.nd.running{border-color:var(--am);background:var(--am);animation:pulse 1.6s infinite}
.nd.error,.nd.failed{border-color:var(--rd);background:var(--rd)}
.nd.aborted{border-color:var(--dim);background:var(--pnl2);border-style:dashed}

.rich table.mdt{border-collapse:separate;border-spacing:0;width:100%;margin:2px 0 12px;font-size:11.5px;border:1px solid var(--ln);border-radius:6px;background:var(--pnl)}

.rich table.mdt code{overflow-wrap:anywhere}

.pane[data-t^="IN"] .rich{padding-left:11px;border-left:2px solid color-mix(in srgb,var(--am) 42%,transparent)}
.pane[data-t^="IN"] .rich p{line-height:1.9}

@keyframes rise{from{opacity:0;transform:translateY(-5px)}}

    }
    else {
        url = `/api/agent?proj=${encodeURIComponent(sp[0] || '')}&sess=${encodeURIComponent(sp[1] || '')}&run=${encodeURIComponent(sp[2] || '')}&agent=${encodeURIComponent(sp[3] || '')}`;
    }
    const note = (txt) => {
        const cur = (x.ownerDocument || document).querySelector(`details[data-k="${CSS.escape(k)}"]`) || x;
        const rich = cur.querySelector('.pane .rich');
        if (rich)
            rich.textContent = txt;
    };
    fetch(url).then(r => r.json()).then(rd => {
        const d = rd;
        if (FULL[k])
            return;
        FULL[k] = { p: d.prompt || '', r: d.result || '' };
        // fetch 期间轮询可能已重建卡片(x 成孤儿节点):按 data-k 重查活节点再写入;
        // 且 card/sessCard 均为 FULL 感知渲染,重建卡自带全文——不再出现"闪一下变空白"
        const cur = (x.ownerDocument || document).querySelector(`details[data-k="${CSS.escape(k)}"]`) || x;
        cur.querySelectorAll('.pane').forEach(pn => {
            const t = pn.dataset.t || '', rich = pn.querySelector('.rich');
            if (!rich)
                return;
            if (t.startsWith('IN') && FULL[k].p) {
                rich.innerHTML = mdLite(wrapLong(unent(FULL[k].p)));
                pn.dataset.t = 'IN · ' + T('全文');
            }
            else if (t.startsWith('IN') && d.miss) {
                rich.textContent = T('⚠ 该步已超出转录留存范围，无法回取全文');
                pn.dataset.t = 'IN · ' + T('不可回取');
            }
            if (t.startsWith('OUT') && FULL[k].r) {
                rich.innerHTML = mdLite(pretty(unent(FULL[k].r)));
                pn.dataset.t = 'OUT · ' + T('全文');
            }
            else if (t.startsWith('OUT') && d.miss) {
                rich.textContent = T('⚠ 该步已超出转录留存范围，无法回取全文');
                pn.dataset.t = 'OUT · ' + T('不可回取');
            }
        });
    }).catch(err => { note(T('⚠ 全文加载失败: ') + String((err && err.message) || err)); });
};
$('list').addEventListener('toggle', onToggle, true);
$('sess').addEventListener('toggle', onToggle, true);
$('verB').textContent = VER ? 'v' + VER : ''; // 版本角标:旧标签页(无此角标)= 陈旧代码,请刷新
setInterval(() => { if (auto)
    void tick(); }, 2000);
void tick();
</script></body></html>
